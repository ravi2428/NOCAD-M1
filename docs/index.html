:root {
  --body-bg: transparent;
  --ff-sans: 'Google Sans Flex', 'Google Sans Text', 'Google Sans', sans-serif;
  --ff-mono: 'Google Sans Code', 'Google Sans Mono', monospace;

  --lumi-sys-spacing--xxs: 2px;
  --lumi-sys-spacing--xs: 4px;
  --lumi-sys-spacing--s: 8px;
  --lumi-sys-spacing--m: 12px;
  --lumi-sys-spacing--l: 16px;
  --lumi-sys-spacing--xl: 20px;

  --lumi-sys-shape--small: 8px;
  --lumi-sys-shape--medium: 12px;
  --lumi-sys-shape--large: 16px;
  --lumi-sys-shape--full: 999px;

  --lumi-sys-color--surface: #fdfcfc;
  --lumi-sys-color--surface-dim: #f2f0f0;
  --lumi-sys-color--surface-bright: #ffffff;
  --lumi-sys-color--surface-container: #f2f0f0;
  --lumi-sys-color--surface-container-high: #e6e6e6;
  --lumi-sys-color--on-surface: #000000;
  --lumi-sys-color--on-surface-variant: rgba(0, 0, 0, 0.55);
  
  --lumi-sys-color--positive: #008052;
  --lumi-sys-color--positive-container: #daf9d4;
  --lumi-sys-color--error: #de2d29;
  --lumi-sys-color--error-container: #ffdeec;
  --lumi-sys-color--primary: #3186ff;
  --lumi-sys-color--accent-container: #dcf1ff;
  --lumi-sys-color--outline: #727676;
  --lumi-sys-color--stroke-default: #e3e3e3;
}

:root[data-theme="dark"], body.dark-mode {
  --body-bg: #0f0f0f;
  --lumi-sys-color--surface: #0f0f0f;
  --lumi-sys-color--surface-dim: #141414;
  --lumi-sys-color--surface-bright: #1c1c1c;
  --lumi-sys-color--surface-container: #141414;
  --lumi-sys-color--surface-container-high: #1c1c1c;
  --lumi-sys-color--on-surface: #e0e0e0;
  --lumi-sys-color--on-surface-variant: rgba(255, 255, 255, 0.55);
  
  --lumi-sys-color--positive: #0ebc5f;
  --lumi-sys-color--positive-container: #002220;
  --lumi-sys-color--error: #ff4c45;
  --lumi-sys-color--error-container: #3c0202;
  --lumi-sys-color--primary: #9dd2ff;
  --lumi-sys-color--accent-container: #192967;
  --lumi-sys-color--outline: #9a9b9c;
  --lumi-sys-color--stroke-default: #2d2f38;
}

:root {
  --surface: var(--lumi-sys-color--surface);
  --surface-dim: var(--lumi-sys-color--surface-dim);
  --surface-bright: var(--lumi-sys-color--surface-bright);
  --surface-container: var(--lumi-sys-color--surface-container);
  --on-surface: var(--lumi-sys-color--on-surface);
  --on-surface-variant: var(--lumi-sys-color--on-surface-variant);
  --primary: var(--lumi-sys-color--primary);
  --accent-container: var(--lumi-sys-color--accent-container);
  --positive: var(--lumi-sys-color--positive);
  --positive-container: var(--lumi-sys-color--positive-container);
  --error: var(--lumi-sys-color--error);
  --error-container: var(--lumi-sys-color--error-container);
  --outline: var(--lumi-sys-color--outline);
  --stroke-default: var(--lumi-sys-color--stroke-default);
  --r-m: var(--lumi-sys-shape--medium);
  --r-full: var(--lumi-sys-shape--full);
}

html, body {
  background: var(--body-bg, transparent) !important;
  color: var(--on-surface) !important;
  overflow-y: auto;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.widget-container { width: 100% !important; max-width: 100% !important; padding-inline: 0 !important; box-sizing: border-box; }
svg text { stroke: none; paint-order: fill; }

  <title>NOCAD-M1 Architecture</title>
  <style>
    .widget-container {
      width: 100%;
      min-height: 280px;
      padding-inline: 0;
      overflow-x: hidden;
      box-sizing: border-box;
      font-family: var(--ff-sans);
      color: var(--on-surface);
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow-y: auto;
      background: transparent;
    }

    .diagram-svg {
      display: block;
      width: 100%;
      max-width: 864px;
      height: auto;
      margin: 0 auto;
      user-select: none;
    }

    .zone-bg {
      fill: var(--surface-dim);
      stroke: var(--stroke-default);
      stroke-width: 1;
      rx: 16px;
    }

    .lane-label {
      font-family: var(--ff-mono);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.06em;
      fill: var(--on-surface-variant);
    }

    .zone-title {
      font-family: var(--ff-mono);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      fill: var(--on-surface-variant);
      text-transform: uppercase;
    }

    .node-group {
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .node-rect {
      fill: var(--surface-container);
      stroke: var(--outline);
      stroke-width: 1.2;
      transition: fill 0.2s ease, stroke 0.2s ease, stroke-width 0.2s ease;
    }

    .node-group:hover .node-rect,
    .node-group.is-active .node-rect {
      fill: var(--accent-container);
      stroke: var(--primary);
      stroke-width: 2;
    }

    .node-text-title {
      font-family: var(--ff-sans);
      font-size: 13px;
      font-weight: 500;
      fill: var(--on-surface);
      pointer-events: none;
      text-anchor: middle;
      paint-order: fill;
      stroke: none;
    }

    .node-text-sub {
      font-family: var(--ff-mono);
      font-size: 12px;
      font-style: italic;
      fill: var(--on-surface-variant);
      pointer-events: none;
      text-anchor: middle;
      paint-order: fill;
      stroke: none;
    }

    .node-outcome-pass .node-rect { fill: var(--positive-container); stroke: var(--positive); }
    .node-outcome-invalid .node-rect { fill: var(--error-container); stroke: var(--error); }
    .node-outcome-suspect .node-rect { fill: var(--surface-bright); stroke: var(--primary); }

    .edge-path {
      fill: none;
      stroke: var(--on-surface);
      stroke-width: 1.3;
      stroke-linecap: round;
      stroke-dasharray: 0 4;
      pointer-events: none;
      transition: stroke 0.2s ease, stroke-width 0.2s ease;
    }

    .edge-path.is-highlighted {
      stroke: var(--primary);
      stroke-width: 2;
      stroke-dasharray: none;
    }

    .pill-bg {
      fill: var(--surface-bright);
      stroke: var(--stroke-default);
      stroke-width: 1;
      rx: 8px;
    }

    .pill-text {
      font-family: var(--ff-mono);
      font-size: 12px;
      font-style: italic;
      fill: var(--on-surface);
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    .detail-card {
      max-width: 680px;
      margin: 12px auto 0;
      padding: 14px 16px;
      background: var(--surface-bright);
      border: 1px solid var(--stroke-default);
      border-radius: var(--r-m, 12px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    .detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .detail-tag {
      font-family: var(--ff-mono);
      font-size: 12px;
      padding: 2px 8px;
      border-radius: var(--r-full, 999px);
      background: var(--surface-container);
      color: var(--primary);
      font-weight: 500;
    }

    .detail-title { font-size: 15px; font-weight: 600; color: var(--on-surface); margin: 0; }
    .detail-desc { font-size: 13px; line-height: 1.45; color: var(--on-surface-variant); margin: 0; }
    .node-popup { position: fixed; z-index: 1000; width: 280px; margin: 0; pointer-events: none; display: none; }
    .node-popup.is-visible { display: block; }
    .hint-footer { text-align: center; font-family: var(--ff-mono); font-size: 12px; color: var(--on-surface-variant); margin-top: 8px; opacity: 0.8; }
  </style>
</head>

        <rect class="node-rect" width="180" height="60" rx="12" />
        <text class="node-text-title" x="90" y="34">22. COLOR ANALYSIS</text>
      </g>
      <g class="node-group" id="node-23" transform="translate(656, 724)">
        <rect class="node-rect" width="180" height="60" rx="12" />
        <text class="node-text-title" x="90" y="34">23. OFFLINE AI</text>
      </g>
      <g class="node-group" id="node-24" transform="translate(450, 714)">
        <path class="node-rect" d="M 92 0 L 184 40 L 92 80 L 0 40 Z" />
        <text class="node-text-title" x="92" y="44">24. SAFETY CHECK</text>
      </g>
      <g class="node-group" id="node-25" transform="translate(450, 834)">
        <path class="node-rect" d="M 92 0 L 184 40 L 92 80 L 0 40 Z" />
        <text class="node-text-title" x="92" y="44">25. QUALITY GATE</text>
      </g>
      <g class="node-group" id="node-26" transform="translate(452, 954)">
        <rect class="node-rect" width="180" height="60" rx="12" />
        <text class="node-text-title" x="90" y="34">26. LOT CALIBRATION</text>
      </g>
      <g class="node-group" id="node-27" transform="translate(432, 1086)">
        <path class="node-rect" d="M 110 0 L 220 40 L 110 80 L 0 40 Z" />
        <text class="node-text-title" x="110" y="44" font-size="12">27. CONTAMINANT CHECK</text>
      </g>
      <g class="node-group node-outcome-invalid" id="node-28" transform="translate(44, 1206)">
        <rect class="node-rect" width="180" height="40" rx="20" />
        <text class="node-text-title" x="90" y="24" font-size="12">28. REJECTED (INVALID)</text>
      </g>
      <g class="node-group node-outcome-pass" id="node-29" transform="translate(452, 1206)">
        <rect class="node-rect" width="180" height="40" rx="20" />
        <text class="node-text-title" x="90" y="24" font-size="12">29. PASS (SCREENED)</text>
      </g>
      <g class="node-group node-outcome-suspect" id="node-30" transform="translate(656, 1206)">
        <rect class="node-rect" width="180" height="40" rx="20" />
        <text class="node-text-title" x="90" y="24" font-size="12">30. DANGER (SUSPECT)</text>
      </g>
      <g class="node-group" id="node-31" transform="translate(452, 1290)">
        <rect class="node-rect" width="180" height="60" rx="12" />
        <text class="node-text-title" x="90" y="34">31. SIGNED RECORD</text>
      </g>
      <g class="node-group" id="node-32" transform="translate(656, 1290)">
        <rect class="node-rect" width="180" height="60" rx="12" />
        <text class="node-text-title" x="90" y="34">32. FSO LEGAL SAMPLE</text>
      </g>
      <g class="node-group" id="node-34" transform="translate(452, 1390)">
        <rect class="node-rect" width="180" height="60" rx="12" />
        <text class="node-text-title" x="90" y="34">34. DASHBOARD</text>
      </g>
      <g class="node-group" id="node-33" transform="translate(656, 1390)">
        <rect class="node-rect" width="180" height="60" rx="12" />
        <text class="node-text-title" x="90" y="34">33. OFFICIAL LAB TEST</text>
      </g>
    </svg>

    <div class="detail-card node-popup" id="detailPanel">
      <div class="detail-header">
        <h3 class="detail-title" id="nodeTitle"></h3>
      </div>
      <p class="detail-desc" id="nodeDesc"></p>
    </div>
    
  </div>

  <script>
    const NODE_DETAILS = {
      "1": {
        "title": "1. Food Sample",
        "sub": "",
        "zone": "",
        "desc": "The milk sample goes into two inlets on the card: one for the toxin test (Lane A) and one for the adulterant test (Lane B)."
      },
      "2": {
        "title": "2. Buffer Vial",
        "sub": "",
        "zone": "",
        "desc": "Lane A: a pre-filled vial mixes an exact amount of milk with a buffer liquid in one squeeze. This calms down fats and proteins so the toxin test works in real milk."
      },
      "3": {
        "title": "3. Sample Pad",
        "sub": "",
        "zone": "",
        "desc": "Acts like a sponge that catches big chunks of food and starts pulling the liquid forward."
      },
      "4": {
        "title": "4. Flow Control",
        "sub": "",
        "zone": "",
        "desc": "The special paper pulls the liquid forward naturally at a steady pace. No electricity or pumps are needed."
      },
      "5": {
        "title": "5. Filter Membrane",
        "sub": "",
        "zone": "",
        "desc": "Traps the messy fats and proteins (like those in milk), letting only the clear liquid pass through."
      },
      "6": {
        "title": "6. Test Zone",
        "sub": "",
        "zone": "",
        "desc": "Red gold nanoparticles carrying an antibody for aflatoxin M1 wait here. The test line gets weaker as the toxin rises; the control line proves the test ran. Limit: 0.5 µg/kg (FSSAI)."
      },
      "7": {
        "title": "7. Viewing Window",
        "sub": "",
        "zone": "",
        "desc": "A perfectly clear area on the strip where the camera will look to read the color changes."
      },
      "8": {
        "title": "8. Absorbent Sponge",
        "sub": "",
        "zone": "",
        "desc": "A thirsty pad at the end of the strip that keeps soaking up liquid, ensuring the flow never stops halfway."
      },
      "9": {
        "title": "9. Capillary Drop",
        "sub": "",
        "zone": "",
        "desc": "Lane B: a thin tube picks up exactly the same small amount of plain milk every time and drops it onto the adulterant zones."
      },
      "10": {
        "title": "10. Adulterant Zones",
        "sub": "",
        "zone": "",
        "desc": "Lane B: small paper spots change color in about a minute. Urea turns yellow, starch blue-black, hydrogen peroxide dark, neutraliser pink, and detergent changes the gold color. A blank spot shows the milk's own color for comparison."
      },
      "11": {
        "title": "11. Sealed Card",
        "sub": "",
        "zone": "",
        "desc": "Locks the used liquid safely inside the card for safe disposal. It is not legal evidence: the legal proof comes from a fresh official sample (block 32)."
      },
      "12": {
        "title": "12. QR & Color Patch",
        "sub": "",
        "zone": "",
        "desc": "The printed QR code tells the reader the test type, batch calibration and expiry date. Printed color squares and corner marks let the software correct colors and find every zone."
      },
      "13": {
        "title": "13. Strip Inserted",
        "sub": "",
        "zone": "",
        "desc": "The inspector slides the disposable strip into the reusable Smart Reader device."
      },
      "14": {
        "title": "14. QR & Heat Check",
        "sub": "",
        "zone": "",
        "desc": "The reader scans the QR code and heat label first. Expired, unknown or heat-damaged cards are rejected before testing."
      },
      "15": {
        "title": "15. Heated Block",
        "sub": "",
        "zone": "",
        "desc": "Keeps the card at a fixed temperature, so the result does not change with hot or cold weather. Temperature and humidity are recorded."
      },
      "16": {
        "title": "16. Dark Box Camera",
        "sub": "",
        "zone": "",
        "desc": "The Reader is a tiny 'dark room'. It blocks out the sun and uses its own perfect light to take a photo."
      },
      "17": {
        "title": "17. Timed Photos",
        "sub": "",
        "zone": "",
        "desc": "The camera takes photos automatically at the right time: adulterant spots at about 1–2 minutes, toxin lines at about 15 minutes. The inspector cannot read too early or too late."
      },
      "18": {
        "title": "18. Raw Picture",
        "sub": "",
        "zone": "",
        "desc": "The camera captures the exact color changes on the strip without any outside glare ruining the shot."
      },
      "19": {
        "title": "19. Lighting Fix",
        "sub": "",
        "zone": "",
        "desc": "The software automatically removes any tiny shadows or background darkness from the picture."
      },
      "20": {
        "title": "20. Color Calibration",
        "sub": "",
        "zone": "",
        "desc": "Ensures the colors are measured exactly the same way every time, no matter what."
      },
      "21": {
        "title": "21. Zoom & Crop",
        "sub": "",
        "zone": "",
        "desc": "The AI automatically finds and isolates the exact spots where the color changed."
      },
      "22": {
        "title": "22. Color Analysis",
        "sub": "",
        "zone": "",
        "desc": "Measures exactly how strong the color is to figure out how much poison might be there."
      },
      "23": {
        "title": "23. Offline AI",
        "sub": "",
        "zone": "",
        "desc": "The brain of the system. It runs entirely on the reader itself without needing any internet connection."
      },
      "24": {
        "title": "24. Safety Check",
        "sub": "",
        "zone": "",
        "desc": "Before answering, the AI asks: 'Is this actually milk? Was the test tricked?' It blocks fake samples."
      },
      "25": {
        "title": "25. Quality Gate",
        "sub": "",
        "zone": "",
        "desc": "Checks that the strip wasn't expired, the temperature was right, the control line appeared and the photo was clear. It runs before any result is given."
      },
      "26": {
        "title": "26. Lot Calibration",
        "sub": "",
        "zone": "",
        "desc": "Uses the calibration for this batch of cards (read from the QR code) to turn the color strength into a contaminant level."
      },
      "27": {
        "title": "27. Contaminant Check",
        "sub": "",
        "zone": "",
        "desc": "Calculates if the detected poison level is dangerously high according to safety rules (aflatoxin M1 limit: 0.5 µg/kg). Results very close to the limit are tested again."
      },
      "28": {
        "title": "28. Rejected (INVALID))",
        "sub": "",
        "zone": "",
        "desc": "The test was tricked, broken, or fake. The system refuses to guess and tells the user to try again."
      },
      "29": {
        "title": "29. Pass (screened)",
        "sub": "",
        "zone": "",
        "desc": "The sample passed screening for these tests. The app saves a signed digital record."
      },
      "30": {
        "title": "30. Danger (SUSPECT))",
        "sub": "",
        "zone": "",
        "desc": "Contamination suspected! The Food Safety Officer is alerted to take a legal sample."
      },
      "31": {
        "title": "31. Signed Record",
        "sub": "",
        "zone": "",
        "desc": "Every test, including rejected ones, is saved with its photo, time and place, locked with a digital fingerprint (SHA-256) and signed. Records cannot be secretly changed and sync when internet is available."
      },
      "32": {
        "title": "32. FSO Legal Sample",
        "sub": "",
        "zone": "",
        "desc": "The Food Safety Officer takes a fresh official sample of the food under Section 47 of the FSS Act, sealed in four parts."
      },
      "33": {
        "title": "33. Official Lab Test",
        "sub": "",
        "zone": "",
        "desc": "An official accredited (NABL) lab tests the legal sample. Its result is the final legal proof."
      },
      "34": {
        "title": "34. Dashboard",
        "sub": "",
        "zone": "",
        "desc": "Lab results come back to the dashboard, which shows problem areas and tracks how accurate each batch of cards is."
      }
    };

    const NODE_EDGES = {};
    document.querySelectorAll('.edge-path').forEach(p => {
      const [a, b] = p.id.replace('edge-', '').split('-');
      [a, b].forEach(k => { (NODE_EDGES[k] = NODE_EDGES[k] || []).push(p.id); });
    });

    let activeNodeId = null;

    function showPopup(id) {
      const popup = document.getElementById('detailPanel');
      const nodeEl = document.getElementById(`node-${id}`);
      if (!popup || !nodeEl) return;
      popup.classList.add('is-visible');
      const r = nodeEl.getBoundingClientRect();
      const pw = popup.offsetWidth, ph = popup.offsetHeight, gap = 10;
      let left = r.right + gap;
      if (left + pw > window.innerWidth - 8) left = r.left - pw - gap;
      if (left < 8) left = Math.max(8, Math.min(r.left, window.innerWidth - pw - 8));
      let top = r.top + r.height / 2 - ph / 2;
      top = Math.max(8, Math.min(top, window.innerHeight - ph - 8));
      popup.style.left = left + 'px';
      popup.style.top = top + 'px';
    }

    function hidePopup() {
      const popup = document.getElementById('detailPanel');
      if (popup) popup.classList.remove('is-visible');
    }

    function selectNode(id) {
      activeNodeId = id;
      const data = NODE_DETAILS[id];
      
      if (data) {
        document.getElementById('nodeTitle').textContent = data.title;
        document.getElementById('nodeDesc').textContent = data.desc;
      }

      document.querySelectorAll('.node-group').forEach(el => {
        el.classList.remove('is-active');
      });
      const activeEl = document.getElementById(`node-${id}`);
      if (activeEl) activeEl.classList.add('is-active');

      document.querySelectorAll('.edge-path').forEach(path => {
        path.classList.remove('is-highlighted');
        path.setAttribute('marker-end', 'url(#lumi-caret)');
      });

      const relatedEdges = NODE_EDGES[id] || [];
      relatedEdges.forEach(edgeId => {
        const edgeEl = document.getElementById(edgeId);
        if (edgeEl) {
          edgeEl.classList.add('is-highlighted');
          edgeEl.setAttribute('marker-end', 'url(#lumi-caret-active)');
        }
      });
    }

    // Size every label pill to its text so nothing spills out
    function fitPills() {
      document.querySelectorAll('.pill').forEach(g => {
        const t = g.querySelector('text'), r = g.querySelector('rect');
        const w = Math.ceil(t.getBBox().width) + 24;
        r.setAttribute('width', w); r.setAttribute('x', -w / 2);
      });
    }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitPills);

    document.addEventListener('DOMContentLoaded', () => {
      fitPills();
      Object.keys(NODE_DETAILS).forEach(id => {
        const nodeEl = document.getElementById(`node-${id}`);
        if (nodeEl) {
          nodeEl.addEventListener('mouseenter', () => { selectNode(id); showPopup(id); });
          nodeEl.addEventListener('mouseleave', hidePopup);
          nodeEl.addEventListener('click', () => { selectNode(id); showPopup(id); });
        }
      });
      selectNode(6);
    });

    const applyTheme = t => { 
      document.documentElement.setAttribute('data-theme', t);
    };

    if (!document.documentElement.hasAttribute('data-theme') && window.matchMedia?.('(prefers-color-scheme: dark)').matches) {
      applyTheme('dark');
    }

    window.addEventListener('message', e => { 
      if (e.data?.type === 'set-theme' || e.data?.type === 'APPLY_THEME') {
        applyTheme(e.data.theme); 
      }
    });

    (function autoResize() {
      function notifyHeight() {
        const c = document.querySelector('.widget-container') || document.body;
        if (!c) return;
        const h = Math.ceil(Math.max(c.getBoundingClientRect().bottom, c.scrollHeight));
        window.parent.postMessage({type: 'widget-resize', height: h}, '*');
      }
      window.addEventListener('load', () => setTimeout(notifyHeight, 120));
      new ResizeObserver(() => notifyHeight()).observe(document.querySelector('.widget-container') || document.body);
    })();
  </script>
</body>
</html>
